services:
  banco_dados:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://banco_dados:27017/carcara_db_dev
      - NODE_ENV=development
      - API_VERSION=1.0.0
      - API_BUILD=compose-dev
      - CORS_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      banco_dados:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: sh -c "npm install --include=dev && npm run dev"

  vision_worker:
    build:
      context: ./vision-worker
    ports:
      - "8000:8000"
    environment:
      - VISION_PORT=8000
      - CORS_ORIGIN=http://localhost:5173
      - VISION_RTSP_ENABLED=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_healthy
      vision_worker:
        condition: service_healthy
    command: sh -c "npm install && ./node_modules/.bin/vite --host 0.0.0.0"

volumes:
  mongo_dev_data:
