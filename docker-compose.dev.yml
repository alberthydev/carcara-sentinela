services:
  banco_dados:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  api:
    image: node:22-alpine
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://banco_dados:27017/carcara_db_dev
      - NODE_ENV=development
    depends_on:
      - banco_dados
    command: sh -c "npm install --include=dev && npm run dev"

  vision_worker:
    build:
      context: ./vision-worker
    ports:
      - "8000:8000"
    environment:
      - VISION_PORT=8000
      - CORS_ORIGIN=http://localhost:5173

  app:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    command: sh -c "npm install && ./node_modules/.bin/vite --host 0.0.0.0"

volumes:
  mongo_dev_data:
