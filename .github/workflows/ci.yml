name: CI

on:
  pull_request:
    paths:
      - 'api/**'
      - 'app/**'
      - 'vision-worker/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'app/**'
      - 'vision-worker/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/**'
            app:
              - 'app/**'
              - '.github/workflows/**'
            worker:
              - 'vision-worker/**'
              - '.github/workflows/**'

  api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Detect build script
        id: has_build
        run: |
          node -e "const scripts=require('./package.json').scripts||{}; require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'has_build=' + (scripts.build ? 'true' : 'false') + '\n')"
      - name: Build
        if: steps.has_build.outputs.has_build == 'true'
        run: npm run build

  app:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  vision-worker:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    defaults:
      run:
        working-directory: vision-worker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vision-worker/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: pytest -q
      - name: Build Docker image
        run: docker build --tag carcara-sentinela-vision-worker:ci .
